version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: gold_postgres
    restart: always
    environment:
      POSTGRES_DB: gold_app
      POSTGRES_USER: gold_user
      POSTGRES_PASSWORD: gold_password
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gold_user -d gold_app"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7
    container_name: gold_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    container_name: gold_backend
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://gold_user:gold_password@postgres:5432/gold_app?schema=public
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started